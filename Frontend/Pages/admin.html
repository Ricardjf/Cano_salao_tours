            window.saveTour = async function(id) {
                // Validar formulario
                const isValid = validateForm(id ? 'edit-tour-form' : 'create-tour-form', {
                    'tour-name': { validators: [validators.required], name: 'Nombre' },
                    'tour-description': { validators: [validators.required], name: 'Descripción' },
                    'tour-price': { 
                        validators: [(v) => validators.positiveNumber(v, 'Precio', 0)],
                        name: 'Precio'
                    },
                    'tour-capacity': { 
                        validators: [(v) => validators.positiveInteger(v, 'Capacidad', 1, 50)],
                        name: 'Capacidad'
                    },
                    'tour-duration': { validators: [validators.duration], name: 'Duración' }
                });
                
                if (!isValid) {
                    showError('Por favor corrige los errores en el formulario');
                    return;
                }
                
                try {
                    const token = localStorage.getItem(STORAGE_KEYS.TOKEN);
                    
                    const data = {
                        nombre: document.getElementById('tour-name').value,
                        descripcion: document.getElementById('tour-description').value,
                        precio: parseFloat(document.getElementById('tour-price').value),
                        capacidad: parseInt(document.getElementById('tour-capacity').value),
                        duracion: document.getElementById('tour-duration').value,
                        imagen_url: document.getElementById('tour-image').value || null,
                        disponible: document.getElementById('tour-available').checked
                    };
                    
                    const url = id ? `${API_BASE_URL}/api/admin/tours/${id}` : `${API_BASE_URL}/api/admin/tours`;
                    const method = id ? 'PUT' : 'POST';
                    
                    const res = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify(data)
                    });
                    
                    if (res.ok) {
                        const result = await res.json();
                        showSuccess(id ? 'Tour actualizado' : 'Tour creado');
                        closeModal();
                        
                        if (id) {
                            const index = allTours.findIndex(t => t.id === id);
                            if (index !== -1) allTours[index] = { ...allTours[index], ...data, id };
                        } else if (result.tour) {
                            allTours.push(result.tour);
                        }
                        
                        loadSection(currentSection);
                    } else {
                        // Fallback local
                        if (id) {
                            const index = allTours.findIndex(t => t.id === id);
                            if (index !== -1) {
                                allTours[index] = { ...allTours[index], ...data, id };
                                showSuccess('Tour actualizado (local)');
                            }
                        } else {
                            const newTour = { ...data, id: allTours.length + 1 };
                            allTours.push(newTour);
                            showSuccess('Tour creado (local)');
                        }
                        closeModal();
                        loadSection(currentSection);
                    }
                } catch (error) {
                    // Fallback local
                    if (id) {
                        const index = allTours.findIndex(t => t.id === id);
                        if (index !== -1) {
                            allTours[index] = { 
                                ...allTours[index], 
                                nombre: document.getElementById('tour-name').value,
                                descripcion: document.getElementById('tour-description').value,
                                precio: parseFloat(document.getElementById('tour-price').value),
                                capacidad: parseInt(document.getElementById('tour-capacity').value),
                                duracion: document.getElementById('tour-duration').value,
                                imagen_url: document.getElementById('tour-image').value || null,
                                disponible: document.getElementById('tour-available').checked,
                                id: id
                            };
                            showSuccess('Tour actualizado (local)');
                        }
                    } else {
                        const newTour = {
                            id: allTours.length + 1,
                            nombre: document.getElementById('tour-name').value,
                            descripcion: document.getElementById('tour-description').value,
                            precio: parseFloat(document.getElementById('tour-price').value),
                            capacidad: parseInt(document.getElementById('tour-capacity').value),
                            duracion: document.getElementById('tour-duration').value,
                            imagen_url: document.getElementById('tour-image').value || null,
                            disponible: document.getElementById('tour-available').checked
                        };
                        allTours.push(newTour);
                        showSuccess('Tour creado (local)');
                    }
                    closeModal();
                    loadSection(currentSection);
                }
            };
            
            window.toggleTourStatus = async function(id, activate) {
                if (!await showConfirm(activate ? 'Activar Tour' : 'Desactivar Tour', `¿${activate ? 'Activar' : 'Desactivar'} este tour?`)) return;
                
                try {
                    const token = localStorage.getItem(STORAGE_KEYS.TOKEN);
                    const res = await fetch(`${API_BASE_URL}/api/admin/tours/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ disponible: activate })
                    });
                    
                    if (res.ok) {
                        showSuccess(`Tour ${activate ? 'activado' : 'desactivado'}`);
                        const tour = allTours.find(t => t.id === id);
                        if (tour) tour.disponible = activate;
                        loadSection(currentSection);
                    } else {
                        const tour = allTours.find(t => t.id === id);
                        if (tour) {
                            tour.disponible = activate;
                            showSuccess(`Tour ${activate ? 'activado' : 'desactivado'} (local)`);
                            loadSection(currentSection);
                        }
                    }
                } catch (error) {
                    const tour = allTours.find(t => t.id === id);
                    if (tour) {
                        tour.disponible = activate;
                        showSuccess(`Tour ${activate ? 'activado' : 'desactivado'} (local)`);
                        loadSection(currentSection);
                    } else {
                        showError('Error al cambiar estado');
                    }
                }
            };
            
            window.deleteTour = async function(id) {
                const reservas = allBookings.filter(b => b.tour_id === id).length;
                if (reservas > 0) {
                    showError(`No se puede eliminar: tiene ${reservas} reservas`);
                    return;
                }
                
                if (!await showConfirm('Eliminar Tour', '¿Eliminar permanentemente?')) return;
                
                try {
                    const token = localStorage.getItem(STORAGE_KEYS.TOKEN);
                    const res = await fetch(`${API_BASE_URL}/api/admin/tours/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    if (res.ok) {
                        showSuccess('Tour eliminado');
                        allTours = allTours.filter(t => t.id !== id);
                        loadSection(currentSection);
                    } else {
                        allTours = allTours.filter(t => t.id !== id);
                        showSuccess('Tour eliminado (local)');
                        loadSection(currentSection);
                    }
                } catch (error) {
                    allTours = allTours.filter(t => t.id !== id);
                    showSuccess('Tour eliminado (local)');
                    loadSection(currentSection);
                }
            };

            window.savePost = async function(id) {
                // Validar formulario
                const isValid = validateForm(id ? 'edit-post-form' : 'create-post-form', {
                    'post-title': { validators: [validators.required], name: 'Título' },
                    'post-content': { validators: [validators.required], name: 'Contenido' }
                });
                
                if (!isValid) {
                    showError('Por favor corrige los errores en el formulario');
                    return;
                }
                
                try {
                    const token = localStorage.getItem(STORAGE_KEYS.TOKEN);
                    
                    const data = {
                        titulo: document.getElementById('post-title').value,
                        contenido: document.getElementById('post-content').value,
                        excerpt: document.getElementById('post-excerpt').value,
                        categoria: document.getElementById('post-category').value,
                        autor: document.getElementById('post-author').value,
                        imagen_url: document.getElementById('post-image').value || null,
                        publicado: document.getElementById('post-published').checked
                    };
                    
                    const url = id ? `${API_BASE_URL}/api/admin/blog/${id}` : `${API_BASE_URL}/api/admin/blog`;
                    const method = id ? 'PUT' : 'POST';
                    
                    const res = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify(data)
                    });
                    
                    if (res.ok) {
                        const result = await res.json();
                        showSuccess(id ? 'Artículo actualizado' : 'Artículo creado');
                        closeModal();
                        
                        if (id) {
                            const index = allPosts.findIndex(p => p.id === id);
                            if (index !== -1) allPosts[index] = { ...allPosts[index], ...data, id };
                        } else if (result.post) {
                            allPosts.push(result.post);
                        }
                        
                        loadSection(currentSection);
                    } else {
                        // Fallback local
                        if (id) {
                            const index = allPosts.findIndex(p => p.id === id);
                            if (index !== -1) {
                                allPosts[index] = { ...allPosts[index], ...data, id };
                                showSuccess('Artículo actualizado (local)');
                            }
                        } else {
                            const newPost = { 
                                ...data, 
                                id: allPosts.length + 1,
                                created_at: new Date().toISOString(),
                                vistas: 0
                            };
                            allPosts.push(newPost);
                            showSuccess('Artículo creado (local)');
                        }
                        closeModal();
                        loadSection(currentSection);
                    }
                } catch (error) {
                    // Fallback local
                    if (id) {
                        const index = allPosts.findIndex(p => p.id === id);
                        if (index !== -1) {
                            allPosts[index] = { 
                                ...allPosts[index], 
                                titulo: document.getElementById('post-title').value,
                                contenido: document.getElementById('post-content').value,
                                excerpt: document.getElementById('post-excerpt').value,
                                categoria: document.getElementById('post-category').value,
                                autor: document.getElementById('post-author').value,
                                imagen_url: document.getElementById('post-image').value || null,
                                publicado: document.getElementById('post-published').checked,
                                id: id
                            };
                            showSuccess('Artículo actualizado (local)');
                        }
                    } else {
                        const newPost = {
                            id: allPosts.length + 1,
                            titulo: document.getElementById('post-title').value,
                            contenido: document.getElementById('post-content').value,
                            excerpt: document.getElementById('post-excerpt').value,
                            categoria: document.getElementById('post-category').value,
                            autor: document.getElementById('post-author').value,
                            imagen_url: document.getElementById('post-image').value || null,
                            publicado: document.getElementById('post-published').checked,
                            created_at: new Date().toISOString(),
                            vistas: 0
                        };
                        allPosts.push(newPost);
                        showSuccess('Artículo creado (local)');
                    }
                    closeModal();
                    loadSection(currentSection);
                }
            };
            
            window.togglePostStatus = async function(id, publish) {
                if (!await showConfirm(publish ? 'Publicar' : 'Ocultar', `¿${publish ? 'Publicar' : 'Ocultar'} este artículo?`)) return;
                
                try {
                    const token = localStorage.getItem(STORAGE_KEYS.TOKEN);
                    const res = await fetch(`${API_BASE_URL}/api/admin/blog/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ publicado: publish })
                    });
                    
                    if (res.ok) {
                        showSuccess(`Artículo ${publish ? 'publicado' : 'ocultado'}`);
                        const post = allPosts.find(p => p.id === id);

            window.generateAndDownloadReport = function() {
                const type = document.getElementById('report-type')?.value || 'reservas';
                const period = document.getElementById('report-period')?.value || '30';
                const format = document.getElementById('report-format')?.value || 'excel';
                
                showInfo(`Generando reporte de ${type}...`);
                
                setTimeout(() => {
                    if (format === 'excel') {
                        exportReportToExcel(type, period);
                    } else if (format === 'pdf') {
                        exportReportToPDF(type, period);
                    } else if (format === 'csv') {
                        exportReportToCSV(type, period);
                    }
                }, 500);
            };
            
            function exportReportToExcel(type, period) {
                let data = [];
                let sheetName = 'Reporte';
                
                if (type === 'reservas') {
                    data = allBookings.map(b => ({
                        Código: b.codigo || 'N/A',
                        Cliente: b.user_nombre || 'N/A',
                        Email: b.user_email || 'N/A',
                        Tour: b.tour_nombre || `Tour #${b.tour_id}`,
                        Fecha: formatDate(b.fecha),
                        Personas: b.personas || 1,
                        Total: b.total || 0,
                        Estado: getEstadoTexto(b.estado),
                        'Método Pago': getMetodoPagoTexto(b.metodo_pago),
                        'Fecha Reserva': b.created_at ? new Date(b.created_at).toLocaleString() : 'N/A'
                    }));
                    sheetName = 'Reservas';
                } else if (type === 'ingresos') {
                    const tours = {};
                    allBookings.forEach(b => {
                        const tourName = b.tour_nombre || `Tour #${b.tour_id}`;
                        if (!tours[tourName]) {
                            tours[tourName] = {
                                tour: tourName,
                                reservas: 0,
                                ingresos: 0,
                                personas: 0
                            };
                        }
                        tours[tourName].reservas++;
                        tours[tourName].ingresos += b.total || 0;
                        tours[tourName].personas += b.personas || 1;
                    });
                    
                    data = Object.values(tours).map(t => ({
                        Tour: t.tour,
                        'Total Reservas': t.reservas,
                        'Total Personas': t.personas,
                        'Ingresos Totales': t.ingresos,
                        'Promedio por Reserva': t.ingresos / t.reservas
                    }));
                    sheetName = 'Ingresos';
                } else if (type === 'tours') {
                    data = allTours.map(t => ({
                        ID: t.id,
                        Nombre: t.nombre,
                        Precio: t.precio,
                        Duración: t.duracion,
                        Capacidad: t.capacidad,
                        Estado: t.disponible ? 'Activo' : 'Inactivo',
                        Reservas: allBookings.filter(b => b.tour_id === t.id).length
                    }));
                    sheetName = 'Tours';
                } else if (type === 'usuarios') {
                    data = allUsers.map(u => ({
                        ID: u.id,
                        Nombre: u.nombre,
                        Email: u.email,
                        Teléfono: u.telefono || 'N/A',
                        Rol: u.rol === 'admin' ? 'Administrador' : 'Usuario',
                        Estado: u.activo ? 'Activo' : 'Inactivo',
                        Registro: u.fecha_registro ? new Date(u.fecha_registro).toLocaleDateString() : 'N/A',
                        Reservas: allBookings.filter(b => b.user_id === u.id).length
                    }));
                    sheetName = 'Usuarios';
                } else if (type === 'blog') {
                    data = allPosts.map(p => ({
                        ID: p.id,
                        Título: p.titulo,
                        Categoría: p.categoria,
                        Autor: p.autor,
                        Estado: p.publicado ? 'Publicado' : 'Borrador',
                        Vistas: p.vistas || 0,
                        Fecha: p.created_at ? new Date(p.created_at).toLocaleDateString() : 'N/A'
                    }));
                    sheetName = 'Blog';
                }
                
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, sheetName);
                XLSX.writeFile(wb, `${sheetName}_${new Date().getTime()}.xlsx`);
                
                showSuccess(`Reporte de ${type} exportado exitosamente`);
            }
            
            function exportReportToPDF(type, period) {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('landscape');
                
                doc.setFontSize(18);
                doc.text(`Reporte de ${type} - Caño Salao`, 14, 22);
                doc.setFontSize(10);
                doc.text(`Generado: ${new Date().toLocaleString()}`, 14, 32);
                
                let headers = [];
                let body = [];
                
                if (type === 'reservas') {
                    headers = [['Código', 'Cliente', 'Tour', 'Fecha', 'Personas', 'Total', 'Estado']];
                    body = allBookings.slice(0, 50).map(b => [
                        b.codigo || 'N/A',
                        b.user_nombre || 'N/A',
                        b.tour_nombre || `Tour #${b.tour_id}`,
                        formatDate(b.fecha),
                        (b.personas || 1).toString(),
                        `$${(b.total || 0).toFixed(2)}`,
                        getEstadoTexto(b.estado)
                    ]);
                } else if (type === 'ingresos') {
                    headers = [['Tour', 'Reservas', 'Personas', 'Ingresos', 'Promedio']];
                    const tours = {};
                    allBookings.forEach(b => {
                        const tourName = b.tour_nombre || `Tour #${b.tour_id}`;
                        if (!tours[tourName]) tours[tourName] = { reservas: 0, ingresos: 0, personas: 0 };
                        tours[tourName].reservas++;
                        tours[tourName].ingresos += b.total || 0;
                        tours[tourName].personas += b.personas || 1;
                    });
                    body = Object.entries(tours).map(([name, t]) => [
                        name,
                        t.reservas.toString(),
                        t.personas.toString(),
                        `$${t.ingresos.toFixed(2)}`,
                        `$${(t.ingresos / t.reservas).toFixed(2)}`
                    ]);
                } else if (type === 'tours') {
                    headers = [['ID', 'Nombre', 'Precio', 'Duración', 'Capacidad', 'Estado', 'Reservas']];
                    body = allTours.map(t => [
                        `#${t.id}`,
                        t.nombre || '',
                        `$${(t.precio || 0).toFixed(2)}`,
                        t.duracion || 'N/A',
                        (t.capacidad || 15).toString(),
                        t.disponible ? 'Activo' : 'Inactivo',
                        allBookings.filter(b => b.tour_id === t.id).length.toString()
                    ]);
                }
                
                if (body.length > 0) {
                    doc.autoTable({
                        head: headers,
                        body: body,
                        startY: 45,
                        theme: 'striped',
                        headStyles: { fillColor: [13, 59, 102], textColor: 255 }
                    });
                }
                
                doc.save(`Reporte_${type}_${new Date().getTime()}.pdf`);
                showSuccess(`Reporte de ${type} exportado exitosamente`);
            }
            
            function exportReportToCSV(type, period) {
                let data = [];
                let filename = `reporte_${type}_${new Date().getTime()}.csv`;
                
                if (type === 'reservas') {
                    data = allBookings.map(b => ({
                        Codigo: b.codigo || 'N/A',
                        Cliente: b.user_nombre || 'N/A',
                        Tour: b.tour_nombre || `Tour #${b.tour_id}`,
                        Fecha: formatDate(b.fecha),
                        Personas: b.personas || 1,
                        Total: (b.total || 0).toFixed(2),
                        Estado: getEstadoTexto(b.estado)
                    }));
                } else if (type === 'tours') {
                    data = allTours.map(t => ({
                        ID: t.id,
                        Nombre: t.nombre,
                        Precio: (t.precio || 0).toFixed(2),
                        Duracion: t.duracion || 'N/A',
                        Capacidad: t.capacidad || 15,
                        Estado: t.disponible ? 'Activo' : 'Inactivo',
                        Reservas: allBookings.filter(b => b.tour_id === t.id).length
                    }));
                } else if (type === 'usuarios') {
                    data = allUsers.map(u => ({
                        ID: u.id,
                        Nombre: u.nombre || 'N/A',
                        Email: u.email,
                        Rol: u.rol === 'admin' ? 'Administrador' : 'Usuario',
                        Activo: u.activo ? 'Sí' : 'No',
                        Reservas: allBookings.filter(b => b.user_id === u.id).length
                    }));
                }
                
                if (data.length > 0) {
                    const ws = XLSX.utils.json_to_sheet(data);
                    const csv = XLSX.utils.sheet_to_csv(ws);
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename;
                    link.click();
                    URL.revokeObjectURL(link.href);
                    
                    showSuccess(`Reporte de ${type} exportado exitosamente`);
                } else {
                    showError('No hay datos para exportar');
                }
            }

                                    <select onchange="updateConfig('timezone', this.value)" class="filter-select">
                                        <option value="America/Caracas" ${siteConfig.timezone === 'America/Caracas' ? 'selected' : ''}>Caracas</option>
                                        <option value="America/Bogota" ${siteConfig.timezone === 'America/Bogota' ? 'selected' : ''}>Bogotá</option>
                                        <option value="America/New_York" ${siteConfig.timezone === 'America/New_York' ? 'selected' : ''}>Nueva York</option>
                                    </select>
                                </div>
                            </div>
                            <div class="config-item">
                                <div class="config-item-info">
                                    <h4>Formato de fecha</h4>
                                    <p>${siteConfig.date_format}</p>
                                </div>
                                <div class="config-item-actions">
                                    <select onchange="updateConfig('date_format', this.value)" class="filter-select">
                                        <option value="DD/MM/YYYY" ${siteConfig.date_format === 'DD/MM/YYYY' ? 'selected' : ''}>DD/MM/YYYY</option>
                                        <option value="MM/DD/YYYY" ${siteConfig.date_format === 'MM/DD/YYYY' ? 'selected' : ''}>MM/DD/YYYY</option>
                                        <option value="YYYY-MM-DD" ${siteConfig.date_format === 'YYYY-MM-DD' ? 'selected' : ''}>YYYY-MM-DD</option>
                                    </select>
                                </div>
                            </div>
                            <div class="config-item">
                                <div class="config-item-info">
                                    <h4>Items por página</h4>
                                    <p>${siteConfig.items_per_page}</p>
                                </div>
                                <div class="config-item-actions">
                                    <select onchange="updateConfig('items_per_page', parseInt(this.value))" class="filter-select">
                                        <option value="10" ${siteConfig.items_per_page === 10 ? 'selected' : ''}>10</option>
                                        <option value="25" ${siteConfig.items_per_page === 25 ? 'selected' : ''}>25</option>
                                        <option value="50" ${siteConfig.items_per_page === 50 ? 'selected' : ''}>50</option>
                                        <option value="100" ${siteConfig.items_per_page === 100 ? 'selected' : ''}>100</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="config-section">
                        <h3><i class="bi bi-database"></i> Mantenimiento</h3>
                        <div class="config-grid">
                            <div class="config-item">
                                <div class="config-item-info">
                                    <h4>Respaldar base de datos</h4>
                                    <p>Crear una copia de seguridad</p>
                                </div>
                                <div class="config-item-actions">
                                    <button class="btn btn-primary" onclick="backupDatabase()">
                                        <i class="bi bi-database-down"></i> Respaldar
                                    </button>
                                </div>
                            </div>
                            <div class="config-item">
                                <div class="config-item-info">
                                    <h4>Restaurar respaldo</h4>
                                    <p>Restaurar desde archivo</p>
                                </div>
                                <div class="config-item-actions">
                                    <button class="btn btn-warning" onclick="restoreDatabase()">
                                        <i class="bi bi-database-up"></i> Restaurar
                                    </button>
                                </div>
                            </div>
                            <div class="config-item">
                                <div class="config-item-info">
                                    <h4>Limpiar caché</h4>
                                    <p>Eliminar datos temporales</p>
                                </div>
                                <div class="config-item-actions">
                                    <button class="btn btn-info" onclick="clearCache()">
                                        <i class="bi bi-trash"></i> Limpiar
                                    </button>
                                </div>
                            </div>
                            <div class="config-item">
                                <div class="config-item-info">
                                    <h4>Reiniciar contadores</h4>
                                    <p>Restablecer estadísticas</p>
                                </div>
                                <div class="config-item-actions">
                                    <button class="btn btn-danger" onclick="resetCounters()">
                                        <i class="bi bi-arrow-counterclockwise"></i> Reiniciar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                mainContent.innerHTML = html;
            }
            
            window.toggleConfig = function(key) {
                siteConfig[key] = !siteConfig[key];
                const toggle = document.getElementById(`toggle-${key}`);
                if (toggle) {
                    if (siteConfig[key]) {
                        toggle.classList.add('active');
                    } else {
                        toggle.classList.remove('active');
                    }
                }
                showInfo(`${key.replace(/_/g, ' ')}: ${siteConfig[key] ? 'Activado' : 'Desactivado'}`);
            };
            
            window.updateConfig = function(key, value) {
                siteConfig[key] = value;
                showInfo(`${key.replace(/_/g, ' ')} actualizado`);
            };
            
            window.editConfigField = function(key) {
                const currentValue = siteConfig[key];
                let promptMessage = `Editar ${key.replace(/_/g, ' ')}:`;
                let newValue = prompt(promptMessage, currentValue);
                
                if (newValue !== null && newValue.trim() !== '') {
                    // Validar según el campo
                    if (key === 'site_email') {
                        const emailValid = validators.email(newValue);
                        if (!emailValid.valid) {
                            showError(emailValid.message);
                            return;
                        }
                    } else if (key === 'site_phone') {
                        const phoneValid = validators.phone(newValue);
                        if (!phoneValid.valid) {
                            showError(phoneValid.message);
                            return;
                        }
                    }
                    
                    siteConfig[key] = newValue.trim();
                    showSuccess(`${key.replace(/_/g, ' ')} actualizado`);
                    renderConfiguracion();
                }
            };
            
            window.backupDatabase = function() {
                const backup = {
                    users: allUsers,
                    tours: allTours,
                    bookings: allBookings,
                    posts: allPosts,
                    config: siteConfig,
                    timestamp: new Date().toISOString()
                };
                
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `cano_salao_backup_${new Date().getTime()}.json`;
                a.click();
                URL.revokeObjectURL(url);
                
                showSuccess('Respaldo creado exitosamente');
            };
            
            window.restoreDatabase = function() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = function(e) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        try {
                            const backup = JSON.parse(event.target.result);
                            
                            if (backup.users) allUsers = backup.users;
                            if (backup.tours) allTours = backup.tours;
                            if (backup.bookings) allBookings = backup.bookings;
                            if (backup.posts) allPosts = backup.posts;
                            if (backup.config) siteConfig = { ...siteConfig, ...backup.config };
                            
                            localStorage.setItem('cano_salao_config', JSON.stringify(siteConfig));
                            
                            showSuccess('Base de datos restaurada exitosamente');
                            updatePendingBadge(allBookings.filter(b => b.estado === 'pending').length);
                            loadSection(currentSection);
                        } catch (error) {
                            showError('Error al restaurar el respaldo');
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            };
            
            window.clearCache = function() {
                localStorage.removeItem('cano_salao_tmp');
                showSuccess('Caché limpiado exitosamente');
            };
            
            window.resetCounters = function() {
                if (showConfirm('Reiniciar Contadores', '¿Estás seguro de reiniciar las estadísticas? Esta acción no eliminará datos, solo restablecerá los contadores.')) {
                    showSuccess('Contadores reiniciados');
                }
            };
            
            // ========== EXPORTACIONES ==========
            window.exportBookingsExcel = function() {
                exportReportToExcel('reservas', 'all');
            };
            
            window.exportBookingsPDF = function() {
                exportReportToPDF('reservas', 'all');
            };
            
            window.exportTours = function() {
                exportReportToExcel('tours', 'all');
            };
            
            window.exportUsers = function() {
                exportReportToExcel('usuarios', 'all');
            };
            
            window.exportPosts = function() {
                exportReportToExcel('blog', 'all');
            };
            
            window.exportAllData = function() {
                const wb = XLSX.utils.book_new();
                
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allBookings.map(b => ({
                    Código: b.codigo,
                    Cliente: b.user_nombre,
                    Email: b.user_email,
                    Tour: b.tour_nombre,
                    Fecha: b.fecha,
                    Personas: b.personas,
                    Total: b.total,
                    Estado: b.estado
                }))), 'Reservas');
                
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allTours.map(t => ({
                    ID: t.id,
                    Nombre: t.nombre,
                    Precio: t.precio,
                    Duración: t.duracion,
                    Capacidad: t.capacidad,
                    Estado: t.disponible ? 'Activo' : 'Inactivo'
                }))), 'Tours');
                
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allUsers.map(u => ({
                    ID: u.id,
                    Nombre: u.nombre,
                    Email: u.email,
                    Rol: u.rol,
                    Activo: u.activo
                }))), 'Usuarios');
                
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allPosts.map(p => ({
                    ID: p.id,
                    Título: p.titulo,
                    Categoría: p.categoria,
                    Publicado: p.publicado,
                    Vistas: p.vistas
                }))), 'Blog');
                
                XLSX.writeFile(wb, `cano_salao_completo_${new Date().getTime()}.xlsx`);
                showSuccess('Datos exportados exitosamente');
            };
            
            // ========== PAGINACIÓN ==========
            function setupPagination(total) {
                const pages = Math.ceil(total / itemsPerPage);
                const container = document.getElementById('pagination-controls');
                if (!container) return;
                
                let html = '';
                html += `<button onclick="changePage(1)" ${currentPage === 1 ? 'disabled' : ''}><i class="bi bi-chevron-double-left"></i></button>`;
                html += `<button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}><i class="bi bi-chevron-left"></i></button>`;
                
                for (let i = 1; i <= pages; i++) {
                    if (i === 1 || i === pages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                        html += `<button class="${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                    } else if (i === currentPage - 3 || i === currentPage + 3) {
                        html += `<button disabled>...</button>`;
                    }
                }
                
                html += `<button onclick="changePage(${currentPage + 1})" ${currentPage === pages ? 'disabled' : ''}><i class="bi bi-chevron-right"></i></button>`;
                html += `<button onclick="changePage(${pages})" ${currentPage === pages ? 'disabled' : ''}><i class="bi bi-chevron-double-right"></i></button>`;
                
                container.innerHTML = html;
            }
            
            window.changePage = function(page) {
                currentPage = page;
                loadSection(currentSection);
            };
            
            // ========== FUNCIONES AUXILIARES ==========
            function getEstadoTexto(estado) {
                const map = { pending: 'Pendiente', confirmed: 'Confirmada', cancelled: 'Cancelada', completed: 'Completada' };
                return map[estado] || estado || 'Pendiente';
            }
            
            function getMetodoPagoTexto(metodo) {
                const map = { tarjeta: 'Tarjeta', transferencia: 'Transferencia', movil: 'Pago Móvil', efectivo: 'Efectivo' };
                return map[metodo] || metodo || 'No especificado';
            }
            
            function formatDate(date) {
                if (!date) return 'N/A';
                try {
                    const d = new Date(date);
                    if (isNaN(d.getTime())) return date;
                    return d.toLocaleDateString();
                } catch {
                    return date;
                }
            }
            
            function validateEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }
            
            // ========== SISTEMA DE ALERTAS ==========
            function showAlert(message, type) {
                const alert = document.getElementById('site-alert');
                alert.className = `site-alert ${type}`;
                alert.innerHTML = `<i class="bi ${type === 'success' ? 'bi-check-circle' : type === 'error' ? 'bi-exclamation-triangle' : 'bi-info-circle'}"></i> ${message}`;
                alert.style.display = 'block';
                setTimeout(() => { alert.style.display = 'none'; }, 4000);
            }
            
            function showSuccess(m) { showAlert(m, 'success'); }
            function showError(m) { showAlert(m, 'error'); }
            function showInfo(m) { showAlert(m, 'info'); }
            function showWarning(m) { showAlert(m, 'warning'); }
            
            // ========== MODAL CONFIRMACIÓN ==========
            window.showConfirm = function(title, message) {
                return new Promise(resolve => {
                    const modal = document.getElementById('confirm-modal');
                    document.getElementById('confirm-title').innerHTML = title;
                    document.getElementById('confirm-message').innerHTML = message;
                    
                    const confirmBtn = document.getElementById('confirm-confirm-btn');
                    
                    const handler = function() {
                        modal.classList.remove('active');
                        confirmBtn.removeEventListener('click', handler);
                        resolve(true);
                    };
                    
                    confirmBtn.addEventListener('click', handler, { once: true });
                    modal.classList.add('active');
                    
                    window.closeConfirmModal = function() {
                        modal.classList.remove('active');
                        confirmBtn.removeEventListener('click', handler);
                        resolve(false);
                    };
                });
            };
            
            window.closeConfirmModal = function() {
                document.getElementById('confirm-modal').classList.remove('active');
            };
            
            window.closeModal = function() {
                document.getElementById('modal').classList.remove('active');
            };
            
            // ========== LOGOUT ==========
            async function logout() {
                const confirmed = await showConfirm('Cerrar Sesión', '¿Estás seguro que deseas cerrar la sesión?');
                if (confirmed) {
                    clearSession();
                    window.location.href = '../Pages/login.html';
                }
            }
            
            // ========== EXPONER GLOBALMENTE ==========
            window.loadSection = loadSection;
            window.refreshDashboard = refreshDashboard;
            window.filterBookings = filterBookings;
            window.filterTours = filterTours;
            window.filterUsers = filterUsers;
            window.filterPosts = filterPosts;
            window.openCreateBookingModal = openCreateBookingModal;
            window.createBooking = createBooking;
            window.confirmBooking = confirmBooking;
            window.completeBooking = completeBooking;
            window.viewBooking = viewBooking;
            window.editBooking = editBooking;
            window.saveBooking = saveBooking;
            window.deleteBooking = deleteBooking;
            window.calculateTotal = function() {};
            window.editCalculateTotal = function() {};
            window.openCreateTourModal = openCreateTourModal;
            window.editTour = editTour;
            window.saveTour = saveTour;
            window.toggleTourStatus = toggleTourStatus;
            window.deleteTour = deleteTour;
            window.viewUser = viewUser;
            window.editUser = editUser;
            window.saveUser = saveUser;
            window.toggleUserStatus = toggleUserStatus;
            window.openCreatePostModal = openCreatePostModal;
            window.editPost = editPost;
            window.savePost = savePost;
            window.togglePostStatus = togglePostStatus;
            window.deletePost = deletePost;
            window.generateAndDownloadReport = generateAndDownloadReport;
            window.exportBookingsExcel = exportBookingsExcel;
            window.exportBookingsPDF = exportBookingsPDF;
            window.exportTours = exportTours;
            window.exportUsers = exportUsers;
            window.exportPosts = exportPosts;
            window.exportAllData = exportAllData;
            window.openImageModal = openImageModal;
            window.closeImageModal = closeImageModal;
            window.toggleConfig = toggleConfig;
            window.updateConfig = updateConfig;
            window.editConfigField = editConfigField;
            window.backupDatabase = backupDatabase;
            window.restoreDatabase = restoreDatabase;
            window.clearCache = clearCache;
            window.resetCounters = resetCounters;
            window.saveConfig = saveConfig;
            window.changePage = changePage;
            window.closeModal = closeModal;
            window.closeConfirmModal = closeConfirmModal;
            window.showConfirm = showConfirm;
            
            // Iniciar
            init();
        })();
    </script>
