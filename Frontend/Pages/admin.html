                    const token = localStorage.getItem(STORAGE_KEYS.TOKEN);
                    const res = await fetch(`${API_BASE_URL}/api/admin/blog/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ publicado: publish })
                    });
                    
                    if (res.ok) {
                        showSuccess(`Artículo ${publish ? 'publicado' : 'ocultado'}`);
                        const post = allPosts.find(p => p.id === id);
                        if (post) post.publicado = publish;
                        loadSection(currentSection);
                    }
                } catch (error) {
                    showError('Error al cambiar estado');
                }
            };
            
            window.deletePost = async function(id) {
                if (!await showConfirm('Eliminar Artículo', '¿Eliminar permanentemente?')) return;
                
                try {
                    const token = localStorage.getItem(STORAGE_KEYS.TOKEN);
                    const res = await fetch(`${API_BASE_URL}/api/admin/blog/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    if (res.ok) {
                        showSuccess('Artículo eliminado');
                        allPosts = allPosts.filter(p => p.id !== id);
                        loadSection(currentSection);
                    }
                } catch (error) {
                    showError('Error al eliminar');
                }
            };
            
            // ========== REPORTES ==========
            async function renderReportes() {
                const mainContent = document.getElementById('main-content');
                
                const totalRevenue = allBookings.reduce((sum, b) => sum + (b.total || 0), 0);
                const avgBooking = allBookings.length > 0 ? totalRevenue / allBookings.length : 0;
                
                const pending = allBookings.filter(b => b.estado === 'pending').length;
                const confirmed = allBookings.filter(b => b.estado === 'confirmed').length;
                const completed = allBookings.filter(b => b.estado === 'completed').length;
                const cancelled = allBookings.filter(b => b.estado === 'cancelled').length;
                
                const tourCounts = {};
                allBookings.forEach(b => {
                    const name = b.tour_nombre || `Tour #${b.tour_id}`;
                    tourCounts[name] = (tourCounts[name] || 0) + 1;
                });
                
                const popularTours = Object.entries(tourCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
                
                let html = `
                    <div class="section-header">
                        <h2><i class="bi bi-file-earmark-bar-graph"></i> Reportes</h2>
                        <div class="section-actions">
                            <button onclick="exportAllData()" class="btn btn-success">
                                <i class="bi bi-download"></i> Exportar Todo
                            </button>
                        </div>
                    </div>
                    
                    <div class="report-filters">
                        <div>
                            <label style="display: block; margin-bottom: 8px; font-weight: 500;">Período</label>
                            <select id="report-period" class="form-control">
                                <option value="30">Últimos 30 días</option>
                                <option value="90">Últimos 90 días</option>
                                <option value="365">Último año</option>
                                <option value="all">Todo</option>
                            </select>
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 8px; font-weight: 500;">Reporte</label>
                            <select id="report-type" class="form-control">
                                <option value="reservas">Reservas</option>
                                <option value="ingresos">Ingresos</option>
                                <option value="tours">Tours</option>
                            </select>
                        </div>
                        <div>
                            <button onclick="generateReport()" class="btn btn-primary">
                                <i class="bi bi-file-earmark-bar-graph"></i> Generar
                            </button>
                        </div>
                    </div>
                    
                    <div class="report-summary">
                        <div class="summary-card">
                            <h4>Total Reservas</h4>
                            <div class="value">${allBookings.length}</div>
                            <div class="sub">${pending} pendientes</div>
                        </div>
                        <div class="summary-card">
                            <h4>Ingresos Totales</h4>
                            <div class="value">$${totalRevenue.toFixed(2)}</div>
                            <div class="sub">Promedio $${avgBooking.toFixed(2)}</div>
                        </div>
                        <div class="summary-card">
                            <h4>Usuarios</h4>
                            <div class="value">${allUsers.length}</div>
                            <div class="sub">${allUsers.filter(u => u.activo).length} activos</div>
                        </div>
                        <div class="summary-card">
                            <h4>Tours Activos</h4>
                            <div class="value">${allTours.filter(t => t.disponible).length}</div>
                            <div class="sub">${allTours.length} totales</div>
                        </div>
                    </div>
                    
                    <div class="charts-grid">
                        <div class="chart-container">
                            <h3><i class="bi bi-pie-chart"></i> Estado de Reservas</h3>
                            <canvas id="report-status-chart"></canvas>
                        </div>
                        <div class="chart-container">
                            <h3><i class="bi bi-trophy"></i> Tours Populares</h3>
                            <canvas id="report-tours-chart"></canvas>
                        </div>
                    </div>
                    
                    <div style="margin-top: 30px;">
                        <h3 style="color: #0d3b66; margin-bottom: 20px;">Top 5 Tours</h3>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Tour</th>
                                        <th>Reservas</th>
                                        <th>Ingresos</th>
                                        <th>%</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;
                
                if (popularTours.length === 0) {
                    html += '<tr><td colspan="5" style="text-align: center;">No hay datos suficientes</td></tr>';
                } else {
                    popularTours.forEach(([name, count], index) => {
                        const revenue = allBookings
                            .filter(b => (b.tour_nombre || `Tour #${b.tour_id}`) === name)
                            .reduce((sum, b) => sum + (b.total || 0), 0);
                        const percentage = allBookings.length > 0 ? ((count / allBookings.length) * 100).toFixed(1) : 0;
                        
                        html += `
                            <tr>
                                <td><strong>${index + 1}</strong></td>
                                <td>${name}</td>
                                <td>${count}</td>
                                <td>$${revenue.toFixed(2)}</td>
                                <td>${percentage}%</td>
                            </tr>
                        `;
                    });
                }
                
                html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                
                mainContent.innerHTML = html;
                
                setTimeout(() => {
                    const ctx1 = document.getElementById('report-status-chart')?.getContext('2d');
                    if (ctx1) {
                        new Chart(ctx1, {
                            type: 'doughnut',
                            data: {
                                labels: ['Pendientes', 'Confirmadas', 'Completadas', 'Canceladas'],
                                datasets: [{
                                    data: [pending, confirmed, completed, cancelled],
                                    backgroundColor: ['#ffc107', '#28a745', '#17a2b8', '#dc3545'],
                                    borderWidth: 0
                                }]
                            },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
                        });
                    }
                    
                    const ctx2 = document.getElementById('report-tours-chart')?.getContext('2d');
                    if (ctx2 && popularTours.length > 0) {
                        new Chart(ctx2, {
                            type: 'bar',
                            data: {
                                labels: popularTours.map(t => t[0].length > 20 ? t[0].substring(0, 20) + '...' : t[0]),
                                datasets: [{
                                    label: 'Reservas',
                                    data: popularTours.map(t => t[1]),
                                    backgroundColor: '#FF8C42',
                                    borderRadius: 5
                                }]
                            },
                            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
                        });
                    }
                }, 100);
            }
            
            // ========== EXPORTACIONES ==========
            window.exportBookingsExcel = function() {
                const data = allBookings.map(b => ({
                    Código: b.codigo || 'N/A',
                    Cliente: b.user_nombre || 'N/A',
                    Email: b.user_email || 'N/A',
                    Tour: b.tour_nombre || `Tour #${b.tour_id}`,
                    Fecha: formatDate(b.fecha),
                    Personas: b.personas || 1,
                    Total: b.total || 0,
                    Estado: getEstadoTexto(b.estado),
                    'Método Pago': getMetodoPagoTexto(b.metodo_pago)
                }));
                
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Reservas');
                XLSX.writeFile(wb, `reservas_${new Date().getTime()}.xlsx`);
                showSuccess('Exportado correctamente');
            };
            
            window.exportBookingsPDF = function() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('landscape');
                
                doc.setFontSize(18);
                doc.text('Reporte de Reservas - Caño Salao', 14, 22);
                doc.setFontSize(10);
                doc.text(`Generado: ${new Date().toLocaleDateString()}`, 14, 32);
                
                const headers = [['Código', 'Cliente', 'Tour', 'Fecha', 'Personas', 'Total', 'Estado']];
                const data = allBookings.slice(0, 50).map(b => [
                    b.codigo || 'N/A',
                    b.user_nombre || 'N/A',
                    b.tour_nombre || `Tour #${b.tour_id}`,
                    formatDate(b.fecha),
                    b.personas || 1,
                    `$${(b.total || 0).toFixed(2)}`,
                    getEstadoTexto(b.estado)
                ]);
                
                doc.autoTable({
                    head: headers,
                    body: data,
                    startY: 45,
                    theme: 'striped',
                    headStyles: { fillColor: [13, 59, 102], textColor: 255 }
                });
                
                doc.save(`reservas_${new Date().getTime()}.pdf`);
                showSuccess('PDF generado');
            };
            
            window.exportTours = function() {
                const data = allTours.map(t => ({
                    ID: t.id,
                    Nombre: t.nombre,
                    Descripción: t.descripcion,
                    Precio: t.precio,
                    Duración: t.duracion,
                    Capacidad: t.capacidad,
                    Estado: t.disponible ? 'Activo' : 'Inactivo',
                    Reservas: allBookings.filter(b => b.tour_id === t.id).length
                }));
                
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Tours');
                XLSX.writeFile(wb, `tours_${new Date().getTime()}.xlsx`);
                showSuccess('Exportado correctamente');
            };
            
            window.exportUsers = function() {
                const data = allUsers.map(u => ({
                    ID: u.id,
                    Nombre: u.nombre,
                    Email: u.email,
                    Teléfono: u.telefono || 'N/A',
                    Rol: u.rol === 'admin' ? 'Administrador' : 'Usuario',
                    Estado: u.activo ? 'Activo' : 'Inactivo',
                    Registro: u.fecha_registro ? new Date(u.fecha_registro).toLocaleDateString() : 'N/A',
                    Reservas: allBookings.filter(b => b.user_id === u.id).length
                }));
                
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Usuarios');
                XLSX.writeFile(wb, `usuarios_${new Date().getTime()}.xlsx`);
                showSuccess('Exportado correctamente');
            };
            
            window.exportPosts = function() {
                const data = allPosts.map(p => ({
                    ID: p.id,
                    Título: p.titulo,
                    Categoría: p.categoria,
                    Autor: p.autor,
                    Estado: p.publicado ? 'Publicado' : 'Borrador',
                    Vistas: p.vistas || 0,
                    Fecha: p.created_at ? new Date(p.created_at).toLocaleDateString() : 'N/A'
                }));
                
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Blog');
                XLSX.writeFile(wb, `blog_${new Date().getTime()}.xlsx`);
                showSuccess('Exportado correctamente');
            };
            
            window.exportAllData = function() {
                const wb = XLSX.utils.book_new();
                
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allBookings.map(b => ({
                    Código: b.codigo, Cliente: b.user_nombre, Email: b.user_email, Tour: b.tour_nombre, Fecha: b.fecha, Total: b.total, Estado: b.estado
                }))), 'Reservas');
                
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allTours.map(t => ({
                    ID: t.id, Nombre: t.nombre, Precio: t.precio, Duración: t.duracion, Estado: t.disponible ? 'Activo' : 'Inactivo'
                }))), 'Tours');
                
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allUsers.map(u => ({
                    ID: u.id, Nombre: u.nombre, Email: u.email, Rol: u.rol, Activo: u.activo
                }))), 'Usuarios');
                
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allPosts.map(p => ({
                    ID: p.id, Título: p.titulo, Categoría: p.categoria, Publicado: p.publicado, Vistas: p.vistas
                }))), 'Blog');
                
                XLSX.writeFile(wb, `cano_salao_completo_${new Date().getTime()}.xlsx`);
                showSuccess('Datos exportados');
            };
            
            window.generateReport = function() {
                showInfo('Generando reporte...');
                setTimeout(() => showSuccess('Reporte generado'), 1500);
            };
            
            // ========== PAGINACIÓN ==========
            function setupPagination(total) {
                const pages = Math.ceil(total / itemsPerPage);
                const container = document.getElementById('pagination-controls');
                if (!container) return;
                
                let html = '';
                html += `<button onclick="changePage(1)" ${currentPage === 1 ? 'disabled' : ''}><i class="bi bi-chevron-double-left"></i></button>`;
                html += `<button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}><i class="bi bi-chevron-left"></i></button>`;
                
                for (let i = 1; i <= pages; i++) {
                    if (i === 1 || i === pages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                        html += `<button class="${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                    } else if (i === currentPage - 3 || i === currentPage + 3) {
                        html += `<button disabled>...</button>`;
                    }
                }
                
                html += `<button onclick="changePage(${currentPage + 1})" ${currentPage === pages ? 'disabled' : ''}><i class="bi bi-chevron-right"></i></button>`;
                html += `<button onclick="changePage(${pages})" ${currentPage === pages ? 'disabled' : ''}><i class="bi bi-chevron-double-right"></i></button>`;
                
                container.innerHTML = html;
            }
            
            window.changePage = function(page) {
                currentPage = page;
                loadSection(currentSection);
            };
            
            // ========== FUNCIONES AUXILIARES ==========
            function getEstadoTexto(estado) {
                const map = { pending: 'Pendiente', confirmed: 'Confirmada', cancelled: 'Cancelada', completed: 'Completada' };
                return map[estado] || estado || 'Pendiente';
            }
            
            function getMetodoPagoTexto(metodo) {
                const map = { tarjeta: 'Tarjeta', transferencia: 'Transferencia', movil: 'Pago Móvil', efectivo: 'Efectivo' };
                return map[metodo] || metodo || 'No especificado';
            }
            
            function formatDate(date) {
                if (!date) return 'N/A';
                try {
                    return new Date(date).toLocaleDateString();
                } catch {
                    return date;
                }
            }
            
            // ========== SISTEMA DE ALERTAS ==========
            function showAlert(message, type) {
                const alert = document.getElementById('site-alert');
                alert.className = `site-alert ${type}`;
                alert.innerHTML = `<i class="bi ${type === 'success' ? 'bi-check-circle' : type === 'error' ? 'bi-exclamation-triangle' : 'bi-info-circle'}"></i> ${message}`;
                alert.style.display = 'block';
                setTimeout(() => { alert.style.display = 'none'; }, 4000);
            }
            
            function showSuccess(m) { showAlert(m, 'success'); }
            function showError(m) { showAlert(m, 'error'); }
            function showInfo(m) { showAlert(m, 'info'); }
            function showWarning(m) { showAlert(m, 'warning'); }
            
            // ========== MODAL CONFIRMACIÓN ==========
            window.showConfirm = function(title, message) {
                return new Promise(resolve => {
                    const modal = document.getElementById('confirm-modal');
                    document.getElementById('confirm-title').innerHTML = title;
                    document.getElementById('confirm-message').innerHTML = message;
                    
                    const confirmBtn = document.getElementById('confirm-confirm-btn');
                    
                    const handler = function() {
                        modal.classList.remove('active');
                        confirmBtn.removeEventListener('click', handler);
                        resolve(true);
                    };
                    
                    confirmBtn.addEventListener('click', handler, { once: true });
                    modal.classList.add('active');
                    
                    window.closeConfirmModal = function() {
                        modal.classList.remove('active');
                        confirmBtn.removeEventListener('click', handler);
                        resolve(false);
                    };
                });
            };
            
            window.closeConfirmModal = function() {
                document.getElementById('confirm-modal').classList.remove('active');
            };
            
            window.closeModal = function() {
                document.getElementById('modal').classList.remove('active');
            };
            
            // ========== LOGOUT ==========
            async function logout() {
                await showConfirm('Cerrar Sesión', '¿Cerrar sesión?');
                clearSession();
                window.location.href = '../Pages/login.html';
            }
            
            // ========== EXPONER GLOBALMENTE ==========
            window.loadSection = loadSection;
            window.refreshDashboard = refreshDashboard;
            window.filterBookings = filterBookings;
            window.filterTours = filterTours;
            window.filterUsers = filterUsers;
            window.filterPosts = filterPosts;
            window.confirmBooking = confirmBooking;
            window.completeBooking = completeBooking;
            window.viewBooking = viewBooking;
            window.editBooking = editBooking;
            window.saveBooking = saveBooking;
            window.deleteBooking = deleteBooking;
            window.openCreateTourModal = openCreateTourModal;
            window.editTour = editTour;
            window.saveTour = saveTour;
            window.toggleTourStatus = toggleTourStatus;
            window.deleteTour = deleteTour;
            window.viewUser = viewUser;
            window.editUser = editUser;
            window.saveUser = saveUser;
            window.toggleUserStatus = toggleUserStatus;
            window.openCreatePostModal = openCreatePostModal;
            window.editPost = editPost;
            window.savePost = savePost;
            window.togglePostStatus = togglePostStatus;
            window.deletePost = deletePost;
            window.exportBookingsExcel = exportBookingsExcel;
            window.exportBookingsPDF = exportBookingsPDF;
            window.exportTours = exportTours;
            window.exportUsers = exportUsers;
            window.exportPosts = exportPosts;
            window.exportAllData = exportAllData;
            window.generateReport = generateReport;
            window.changePage = changePage;
            window.closeModal = closeModal;
            window.closeConfirmModal = closeConfirmModal;
            window.showConfirm = showConfirm;
            
            // Iniciar
            init();
        })();
    </script>
</body>
</html>
